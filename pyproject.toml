[project]
name = "mousescrollfixer"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2"]

[dependency-groups]
research = ["torch>=2.5"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false
